// ========================================================================
// PURGE DATA CLEANUP SCOPE
// ========================================================================

// Purge deletes all state-related data via CASCADE DELETE:
//
// | Table | FK Relationship | Cascade Behavior |
// |-------|-----------------|------------------|
// | states | (primary) | Deleted row |
// | state_outputs | state_guid → states(guid) | ON DELETE CASCADE |
// | edges (outgoing) | from_state → states(guid) | ON DELETE CASCADE |
// | edges (incoming) | to_state → states(guid) | ON DELETE CASCADE |
//
// No custom cleanup code needed - database handles cascade.

// ========================================================================
// ERROR CODES
// ========================================================================

// The following Connect RPC error codes should be used:
//
// INVALID_ARGUMENT (3):
//   - Invalid logic_id format
//   - Empty new_logic_id in rename
//
// NOT_FOUND (5):
//   - State with specified GUID/logic_id does not exist
//
// ALREADY_EXISTS (6):
//   - Target logic_id already exists (rename)
//
// PERMISSION_DENIED (7):
//   - User lacks state:rename, state:tombstone, state:restore, or state:purge action
//   - State outside user's label scope
//
// FAILED_PRECONDITION (9):
//   - Cannot rename locked state
//   - Cannot tombstone locked state
//   - Cannot tombstone state with active dependents
//   - Cannot restore active state
//   - Cannot restore state past retention period
//   - Cannot purge active state
//   - Cannot purge state within retention period (without force=true)
//   - Cannot rename tombstoned state

// ========================================================================
// CONCURRENCY HANDLING
// ========================================================================

// Rename uses optimistic locking via updated_at timestamp:
//
// UPDATE states
// SET logic_id = $new_logic_id,
//     updated_at = NOW()
// WHERE guid = $guid
//   AND updated_at = $original_updated_at;  -- Optimistic lock
//
// If RowsAffected = 0, return "concurrent modification detected" error.
// See Decision 6 in research.md for implementation pattern.
